services:
  postgres:
    image: postgres:16-alpine
    container_name: speak-up-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: speakup
      POSTGRES_PASSWORD: speakup
      POSTGRES_DB: speakup
    ports:
      - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U speakup -d speakup']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: speak-up-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
